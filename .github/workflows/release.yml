# vX.Y.Z 태그가 push되면 linux-amd64 바이너리를 빌드해 GitHub Release에
# 첨부합니다.
#
# 흐름: GitLab이 release/<태그> 브랜치를 올림 → PR을 main에 병합 →
# main에서 태그를 push(`git tag vX.Y.Z && git push origin vX.Y.Z`)하면
# 이 워크플로가 실행됩니다. 같은 태그의 Release가 이미 있으면 생성이
# 실패하므로 중복 발행이 되지 않습니다.
#
# 외부 액션은 GitHub 공식 두 개(checkout, setup-go)만 사용하고,
# Release 생성은 러너에 기본 설치된 gh CLI와 자동 발급 토큰
# (contents: write 한정)으로 합니다.
#
# 저장소 설정에서 v* 태그 ruleset(생성·수정·삭제를 관리자만)을 함께
# 걸어야 태그 push 권한이 실제로 제한됩니다.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # Release 생성용. 그 외 권한 없음

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Makefile의 git describe가 태그를 읽도록 전체 이력

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # 릴리스 태그는 main에 병합된 커밋에만 달 수 있습니다.
      # PR을 거치지 않은 커밋에 태그를 달면 여기서 실패합니다.
      - name: 릴리스 태그 출처 확인 (main 소속 커밋인지)
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 검증과 빌드 (fmt-check + vet + test + build)
        run: make
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64

      - name: 배포 묶음 생성 (실행 파일 + 예시 configs + README)
        run: make dist

      - name: 체크섬 생성
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Release 생성 및 파일 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
