# vm-example 하드웨어 그룹 설정
#
# 대상: VM. 단일 NIC와 단일 추가 디스크 구성.
# 이 그룹에 속한 노드는 디스크 by-path와 NIC 구성이 동일해야 합니다.
# 값은 예시입니다. 기본 이미지 부팅으로 실측한 값으로 바꿔 사용하세요.

name: "vm-example"
description: "VM / 단일 NIC / 추가 디스크 1개"

# ── ISO 생성 기본 모드 ───────────────────────────────────────────
# true  : minimal ISO와 분리 rootfs를 사용합니다.
# false : full ISO를 사용합니다.
# 한 번만 바꾸려면 실행 시 --rootfs 또는 --full을 지정하세요.
iso:
  useRootfs: false

# ── 디스크 (실측 by-path) ────────────────────────────────────────
disk:
  # OS 설치 디스크. Butane의 wipe 또는 RAID 대상에 절대 포함하지 마세요.
  osDisk: "/dev/disk/by-path/pci-0000:04:00.0"

# ── 추가 디스크/RAID 구성 (선택) ─────────────────────────────────
# 이 파일이 있으면 butane으로 렌더해 공용 worker Ignition에 병합합니다.
# butane: "vm-example.bu"

# ── 네트워크 ─────────────────────────────────────────────────────
network:
  # generate : nodes.csv, nics.csv와 아래 값으로 NMState YAML을 생성합니다.
  # copy     : sourceDir/<hostname>.yaml을 작업 디렉터리로 복제합니다.
  source: "generate"
  sourceDir: "network-yaml"
  gateway: "192.0.2.1"
  prefixLength: 24
  dns:
    - "192.0.2.10"
    - "192.0.2.11"
  # false면 activeNIC 한 개만 사용합니다.
  bonding: false
  activeNIC: "ens192"

# ── 입력 CSV 파일 이름 ───────────────────────────────────────────
files:
  nodes: "nodes.csv"
  nics: "nics.csv"
  idracs: "idracs.csv"
